name: Build Bastion APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack game
        run: |
          mkdir build
          unzip -q game.zip -d build
          if [ ! -f build/package.json ]; then
            d=$(find build -maxdepth 2 -name package.json | head -1 | xargs dirname)
            mv "$d" build_tmp && rm -rf build && mv build_tmp build
          fi
          ls build

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        working-directory: build
        run: npm install --no-audit --no-fund

      - name: Create Android project
        working-directory: build
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Build APK
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Save APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: bastion-apk
          path: build/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Bastion v${{ github.run_number }}
          files: build/android/app/build/outputs/apk/debug/app-debug.apk
